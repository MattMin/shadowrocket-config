name: Sync rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-rules

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync upstream rules
        run: bash scripts/sync-rules.sh
      - name: Commit changes
        run: |
          [[ -z $(git status --porcelain -- rules) ]] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          git commit -m "update: 同步规则集"
          git push

Spotify = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,MY_PROXY,CF节点,policy-select-name=MY_PROXY
Telegram = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,韩国节点,美国节点,MY_PROXY,policy-select-name=MY_PROXY
